name: skeleton-event-driven-compose

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: skeleton-event-driven-compose-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skeletons/dotnet-angular-event-driven-docker-compose

jobs:
  backend:
    name: Backend (xUnit vs Flyway-migrated PostgreSQL + RabbitMQ)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # the PRODUCTION broker, not an emulator — this substrate has nothing to stand in
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=app_test;Username=postgres;Password=postgres
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Apply Flyway migrations (the schema story of this profile)
        run: >
          docker run --rm --network host
          -v $PWD/Common.Database/db:/flyway/sql
          flyway/flyway:10
          -url=jdbc:postgresql://localhost:5432/app_test
          -user=postgres -password=postgres migrate
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  frontend:
    name: Web (Angular production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skeletons/dotnet-angular-event-driven-docker-compose/Web/package-lock.json
      - run: npm ci
        working-directory: skeletons/dotnet-angular-event-driven-docker-compose/Web
      - run: npm run build
        working-directory: skeletons/dotnet-angular-event-driven-docker-compose/Web

  images:
    name: Docker images build (api+workers, frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skeleton-eventdriven-app .
        working-directory: skeletons/dotnet-angular-event-driven-docker-compose
      - run: docker build -t skeleton-eventdriven-frontend ./Web
        working-directory: skeletons/dotnet-angular-event-driven-docker-compose
