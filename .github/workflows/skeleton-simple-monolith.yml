name: skeleton-simple-monolith

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: skeleton-simple-monolith-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skeletons/dotnet-angular-simple-monolith-single-server

jobs:
  backend:
    name: Backend (build + xUnit vs PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=app_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  image:
    name: Docker image build (SPA into wwwroot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skeleton-simple-monolith .
