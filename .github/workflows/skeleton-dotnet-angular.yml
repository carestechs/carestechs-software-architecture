name: skeleton-dotnet-angular

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: skeleton-dotnet-angular-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skeletons/dotnet-angular-modular-monolith-docker-compose

jobs:
  backend:
    name: Backend (build + xUnit vs PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=app_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  frontend:
    name: Frontend (Angular production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skeletons/dotnet-angular-modular-monolith-docker-compose/client/package-lock.json
      - run: npm ci
        working-directory: skeletons/dotnet-angular-modular-monolith-docker-compose/client
      - run: npm run build
        working-directory: skeletons/dotnet-angular-modular-monolith-docker-compose/client

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t skeleton-dotnet-api .
      - run: docker build -t skeleton-dotnet-frontend ./client
