name: freshness

# Quarterly re-verification driver for version-sensitive ADRs
# (verify_against + last_reviewed): opens/updates an issue listing what is
# due, closes it when everything is fresh again. Manual runs via
# workflow_dispatch.
on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *" # 1st of Jan/Apr/Jul/Oct, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale-report:
    name: ADR freshness report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the stale report
        id: stale
        run: |
          python scripts/validate_adrs.py --stale 6 | tee stale.txt
          if grep -q "All fresh" stale.txt; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the freshness issue
        if: steps.stale.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "The scheduled freshness check found version-sensitive ADRs whose \`last_reviewed\` is older than 6 months."
            echo
            echo '```'
            cat stale.txt
            echo '```'
            echo
            echo "For each ADR listed: re-verify its claims against the \`verify_against\` targets, update the body where reality has moved, and bump \`last_reviewed\`."
            echo
            echo "_Generated by the freshness workflow on $(date -u +%Y-%m-%d)._"
          } > issue-body.md
          EXISTING=$(gh issue list --state open --search 'ADR freshness report in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh issue create --title "ADR freshness report: version-sensitive ADRs need re-verification"               --body-file issue-body.md
          fi

      - name: Close the freshness issue when everything is fresh
        if: steps.stale.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh issue list --state open --search 'ADR freshness report in:title' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All version-sensitive ADRs are fresh again — closing."
          fi
