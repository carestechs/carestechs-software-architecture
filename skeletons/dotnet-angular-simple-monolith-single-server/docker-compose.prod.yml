# Prod: the whole system on one server — app (API + SPA) and postgres
# (adrs/dotnet/single-project-monolith.md, adrs/deployment/container-per-process.md)
services:
  app:
    build: .
    ports:
      - "80:8080"
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=app;Username=postgres;Password=postgres
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment or .env}
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the aspnet runtime image has bash but no curl; use bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
