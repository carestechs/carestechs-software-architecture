# Copied from enforcement/python/ruff.toml (carestechs ADR constraints),
# with skeleton-specific per-file ignores.

[lint]
select = [
  "E4", "E7", "E9", "F", # baseline correctness (ruff defaults)
  "T20",   # adrs/python/structured-logging.md - bans print()/pprint() for diagnostics
  "G",     # adrs/python/structured-logging.md - bans f-strings/.format() in log calls
  "ASYNC", # adrs/python/async-all-the-way.md - blocking calls inside async functions
  "DTZ",   # adrs/database/timestamptz-always.md - naive datetimes without tzinfo
]

[lint.per-file-ignores]
# conftest must set TEST_DATABASE_URL in the environment before importing app
"tests/**" = ["E402"]
