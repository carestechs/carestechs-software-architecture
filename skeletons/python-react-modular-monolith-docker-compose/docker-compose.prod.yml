# Prod: application services only, attached to a pre-existing infra network
# (adrs/deployment/local-dev-compose.md, adrs/deployment/container-per-process.md)
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@infra-postgres:5432/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [infra]

  frontend:
    build: ./client
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [infra]

networks:
  infra:
    external: true
