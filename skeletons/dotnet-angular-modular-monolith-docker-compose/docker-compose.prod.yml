# Prod: application services only, attached to a pre-existing infra network
# (adrs/deployment/local-dev-compose.md, adrs/deployment/container-per-process.md)
services:
  api:
    build: .
    environment:
      DATABASE_URL: Host=infra-postgres;Port=5432;Database=app;Username=postgres;Password=postgres
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      # the aspnet runtime image has bash but no curl/wget; use bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [infra]

  frontend:
    build: ./client
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [infra]

networks:
  infra:
    external: true
